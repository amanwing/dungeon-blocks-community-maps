name: Validation Report

on:
  workflow_run:
    workflows: ["Validate Maps"]
    types: [completed]

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      pull-requests: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if maps changed
        id: maps-changed
        run: |
          FLAG=$(cat artifacts/maps-changed.txt 2>/dev/null || echo "true")
          echo "maps_changed=$FLAG" >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: steps.maps-changed.outputs.maps_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const artifactsDir = 'artifacts';

            const prNumberPath = path.join(artifactsDir, 'pr-number.txt');
            if (!fs.existsSync(prNumberPath)) {
              console.log('No PR number artifact found');
              return;
            }
            const prNumber = parseInt(fs.readFileSync(prNumberPath, 'utf8').trim(), 10);
            if (isNaN(prNumber)) {
              console.log('Invalid PR number in artifact');
              return;
            }

            const checks = [
              { name: 'Ownership', errorFile: 'ownership-errors.txt' },
              { name: 'JSON Schema', errorFile: 'json-schema-errors.txt' },
              { name: 'Image Pairing', errorFile: 'image-pairing-errors.txt' },
              { name: 'File Sizes', errorFile: 'file-size-errors.txt' },
              { name: 'File Types', errorFile: 'file-type-errors.txt' },
              { name: 'Duplicate IDs', errorFile: 'duplicate-id-errors.txt' },
            ];

            const warnings = [
              { name: 'Folder Depth', warningFile: 'folder-depth-warnings.txt' }
            ];

            const successes = [];
            const failures = [];
            const warningBlocks = [];

            for (const check of checks) {
              const filePath = path.join(artifactsDir, check.errorFile);
              if (fs.existsSync(filePath)) {
                const content = fs.readFileSync(filePath, 'utf8').trim();
                failures.push(`❌ **${check.name}**: Failed\n${content}`);
              } else {
                successes.push(`✅ **${check.name}**: Passed`);
              }
            }

            for (const warning of warnings) {
              const filePath = path.join(artifactsDir, warning.warningFile);
              if (fs.existsSync(filePath)) {
                const content = fs.readFileSync(filePath, 'utf8').trim();
                warningBlocks.push(`⚠️ **${warning.name}**\n${content}`);
              }
            }

            const lines = [...successes, ...failures, ...warningBlocks];
            const body = lines.join('\n\n');

            let report = '<!-- dungeon-blocks-validation-bot -->\n';
            if (failures.length > 0) {
              report += `## 🚫 Map Validation Failed\n\n${body}`;
            } else if (warningBlocks.length > 0) {
              report += `## ⚠️ Map Validation Passed with Warnings\n\n${body}`;
            } else {
              report += `## ✅ Map Validation Passed\n\n${body}`;
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes('<!-- dungeon-blocks-validation-bot -->'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: report,
              });
            }
